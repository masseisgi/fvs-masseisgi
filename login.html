<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0d1117;--border:#1e3a4a;--cyan:#22d3ee;--green:#4ade80;
    --red:#f87171;--text:#e2e8f0;--muted:#64748b;--faint:#1e293b;
    --grad:linear-gradient(135deg,#0e7490,#15803d);
  }
  body{
    font-family:'Barlow','Segoe UI',-apple-system,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:20px;
    background-image:radial-gradient(circle at 20% 20%,rgba(34,211,238,.06),transparent 40%),radial-gradient(circle at 80% 80%,rgba(74,222,128,.06),transparent 40%);
  }
  .login-card{
    background:#0f172a;border:1px solid var(--border);border-radius:20px;
    padding:32px 26px;max-width:420px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .logo-area{text-align:center;margin-bottom:24px}
  .logo-area img{width:80px;height:80px;border-radius:18px;margin-bottom:12px}
  .logo-area h1{font-size:1.5rem;font-weight:800;letter-spacing:.02em;
    background:linear-gradient(90deg,var(--cyan),var(--green));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .logo-area p{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-top:4px}
  .tabs{display:flex;gap:8px;margin-bottom:22px;background:var(--faint);border-radius:12px;padding:4px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:9px;cursor:pointer;font-weight:700;font-size:.82rem;color:var(--muted);transition:all .2s;border:none;background:transparent;font-family:inherit}
  .tab.active{background:var(--grad);color:#fff}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:.72rem;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:.9rem;font-family:inherit}
  .field input:focus{outline:none;border-color:var(--cyan)}
  .btn-primary{width:100%;background:var(--grad);color:#fff;border:none;border-radius:10px;padding:14px;font-weight:800;font-size:.9rem;cursor:pointer;font-family:inherit;margin-top:6px;transition:opacity .2s}
  .btn-primary:hover{opacity:.9}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-google{width:100%;background:#fff;color:#1f2937;border:none;border-radius:10px;padding:13px;font-weight:700;font-size:.88rem;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:16px}
  .btn-google:hover{background:#f1f5f9}
  .btn-google svg{width:18px;height:18px}
  .divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:.72rem}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
  .hidden{display:none!important}
  .msg{padding:11px 14px;border-radius:9px;font-size:.8rem;margin-bottom:14px;line-height:1.4}
  .msg.error{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#fca5a5}
  .msg.success{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);color:#86efac}
  .msg.info{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.25);color:#67e8f9}
  .foot{text-align:center;margin-top:20px;font-size:.7rem;color:var(--muted);line-height:1.6}
  .foot a{color:var(--cyan);text-decoration:none}
  .trial-badge{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);border-radius:10px;padding:12px;text-align:center;font-size:.76rem;color:#86efac;margin-bottom:18px;line-height:1.5}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .field-hint{font-size:.68rem;color:var(--muted);margin-top:4px}
</style>
</head>

function showMsg(texto, tipo){
  const area = document.getElementById("msg-area");
  area.innerHTML = '<div class="msg ' + tipo + '">' + texto + '</div>';
}
function clearMsg(){ document.getElementById("msg-area").innerHTML = ""; }

function switchTab(qual){
  document.getElementById("tab-login").classList.toggle("active", qual==="login");
  document.getElementById("tab-signup").classList.toggle("active", qual==="signup");
  document.getElementById("form-login").classList.toggle("hidden", qual!=="login");
  document.getElementById("form-signup").classList.toggle("hidden", qual!=="signup");
  clearMsg();
}

function setLoading(btnId, loading, textoOriginal){
  const btn = document.getElementById(btnId);
  if(loading){
    btn.disabled = true;
    btn.dataset.orig = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>Aguarde...';
  } else {
    btn.disabled = false;
    btn.innerHTML = btn.dataset.orig || textoOriginal;
  }
}

function traduzErro(code){
  const erros = {
    'auth/invalid-email': 'E-mail inválido.',
    'auth/user-disabled': 'Esta conta foi desativada.',
    'auth/user-not-found': 'E-mail não cadastrado.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/email-already-in-use': 'Este e-mail já está cadastrado. Faça login.',
    'auth/weak-password': 'Senha muito fraca. Use ao menos 6 caracteres.',
    'auth/popup-closed-by-user': 'Login cancelado.',
    'auth/network-request-failed': 'Erro de conexão. Verifique sua internet.',
    'auth/too-many-requests': 'Muitas tentativas. Aguarde alguns minutos.'
  };
  return erros[code] || 'Ocorreu um erro. Tente novamente.';
}

// ═══════════════════════════════════════════════════════════
// CRIAR EMPRESA (tenant) + USUÁRIO no Firestore
// ═══════════════════════════════════════════════════════════
async function criarEmpresaEUsuario(user, nomeEmpresa, nomeUsuario){
  const agora = new Date();
  const fimTrial = new Date(agora.getTime() + TRIAL_DIAS*24*60*60*1000);
  const tenantId = user.uid; // o primeiro usuário é dono; tenant = uid dele

  // Cria empresa
  await db.collection("empresas").doc(tenantId).set({
    nome: nomeEmpresa || "Minha Empresa",
    donoUid: user.uid,
    donoEmail: user.email,
    plano: "trial",
    trialInicio: firebase.firestore.Timestamp.fromDate(agora),
    trialFim: firebase.firestore.Timestamp.fromDate(fimTrial),
    iaCota: TRIAL_COTA_IA,
    iaUsadas: 0,
    ativo: true,
    criadoEm: firebase.firestore.Timestamp.fromDate(agora)
  });

  // Cria usuário vinculado ao tenant
  await db.collection("usuarios").doc(user.uid).set({
    nome: nomeUsuario || user.displayName || "",
    email: user.email,
    tenantId: tenantId,
    role: "admin", // dono da empresa
    criadoEm: firebase.firestore.Timestamp.fromDate(agora)
  });

  // Notifica o super admin (registro simples pra você ver os cadastros)
  try {
    await db.collection("notificacoes_admin").add({
      tipo: "novo_cadastro",
      empresa: nomeEmpresa || "(sem nome)",
      email: user.email,
      data: firebase.firestore.Timestamp.fromDate(agora)
    });
  } catch(e){ /* não bloqueia o cadastro */ }
}

// ═══════════════════════════════════════════════════════════
// CADASTRO com e-mail/senha
// ═══════════════════════════════════════════════════════════
async function cadastrar(){
  const empresa = document.getElementById("signup-empresa").value.trim();
  const nome = document.getElementById("signup-nome").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const senha = document.getElementById("signup-senha").value;

  if(!empresa){ showMsg("Informe o nome da empresa.", "error"); return; }
  if(!nome){ showMsg("Informe seu nome.", "error"); return; }
  if(!email){ showMsg("Informe seu e-mail.", "error"); return; }
  if(senha.length < 6){ showMsg("A senha precisa de ao menos 6 caracteres.", "error"); return; }

  setLoading("btn-signup", true);
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, senha);
    await criarEmpresaEUsuario(cred.user, empresa, nome);
    showMsg("Conta criada! Redirecionando...", "success");
    setTimeout(()=>{ window.location.href = APP_URL; }, 1200);
  } catch(e){
    showMsg(traduzErro(e.code), "error");
    setLoading("btn-signup", false);
  }
}

// ═══════════════════════════════════════════════════════════
// LOGIN com e-mail/senha
// ═══════════════════════════════════════════════════════════
async function loginEmail(){
  const email = document.getElementById("login-email").value.trim();
  const senha = document.getElementById("login-senha").value;
  if(!email || !senha){ showMsg("Preencha e-mail e senha.", "error"); return; }

  setLoading("btn-login", true);
  try {
    await auth.signInWithEmailAndPassword(email, senha);
    showMsg("Entrando...", "success");
    setTimeout(()=>{ window.location.href = APP_URL; }, 800);
  } catch(e){
    showMsg(traduzErro(e.code), "error");
    setLoading("btn-login", false);
  }
}

// ═══════════════════════════════════════════════════════════
// LOGIN/CADASTRO com Google
// ═══════════════════════════════════════════════════════════
async function loginGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  clearMsg();
  try {
    const result = await auth.signInWithPopup(provider);
    const user = result.user;
    // Verifica se já existe usuário no Firestore
    const userDoc = await db.collection("usuarios").doc(user.uid).get();
    if(!userDoc.exists){
      // primeiro acesso via Google: cria empresa com nome provisório
      const nomeEmpresa = (user.displayName ? user.displayName + " - Empresa" : "Minha Empresa");
      await criarEmpresaEUsuario(user, nomeEmpresa, user.displayName);
      showMsg("Conta criada! Redirecionando...", "success");
    } else {
      showMsg("Entrando...", "success");
    }
    setTimeout(()=>{ window.location.href = APP_URL; }, 1000);
  } catch(e){
    showMsg(traduzErro(e.code), "error");
  }
}

// ═══════════════════════════════════════════════════════════
// RESET DE SENHA
// ═══════════════════════════════════════════════════════════
async function resetSenha(){
  const email = document.getElementById("login-email").value.trim();
  if(!email){ showMsg("Digite seu e-mail no campo acima e clique novamente em 'Esqueci minha senha'.", "info"); return; }
  try {
    await auth.sendPasswordResetEmail(email);
    showMsg("Enviamos um link de redefinição para " + email, "success");
  } catch(e){
    showMsg(traduzErro(e.code), "error");
  }
}
